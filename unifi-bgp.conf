router bgp 65000
 bgp router-id 192.168.5.1
 no bgp ebgp-requires-policy
 !
 ! ----------------------------
 ! Proxmox SDN / VM subnets
 ! ----------------------------
 neighbor 192.168.5.101 remote-as 65010
 neighbor 192.168.5.101 description pve-node1-primary
 neighbor 192.168.5.101 soft-reconfiguration inbound
 !
 neighbor 192.168.5.102 remote-as 65010
 neighbor 192.168.5.102 description pve-node2-standby
 neighbor 192.168.5.102 soft-reconfiguration inbound
 !
 ! ----------------------------
 ! MetalLB direct VLAN 10 peers
 ! ----------------------------
 neighbor 192.168.10.51 remote-as 65020
 neighbor 192.168.10.51 description k8s-worker-1-vlan10
 neighbor 192.168.10.51 soft-reconfiguration inbound
 !
 neighbor 192.168.10.52 remote-as 65020
 neighbor 192.168.10.52 description k8s-worker-2-vlan10
 neighbor 192.168.10.52 soft-reconfiguration inbound
 !
 neighbor 192.168.10.53 remote-as 65020
 neighbor 192.168.10.53 description k8s-worker-3-vlan10
 neighbor 192.168.10.53 soft-reconfiguration inbound
 !
 address-family ipv4 unicast
  neighbor 192.168.5.101 activate
  neighbor 192.168.5.101 route-map PVE-IN-PRIMARY in
  neighbor 192.168.5.102 activate
  neighbor 192.168.5.102 route-map PVE-IN-STANDBY in
  neighbor 192.168.10.51 activate
  neighbor 192.168.10.51 route-map K8S-METALLB-IN in
  neighbor 192.168.10.52 activate
  neighbor 192.168.10.52 route-map K8S-METALLB-IN in
  neighbor 192.168.10.53 activate
  neighbor 192.168.10.53 route-map K8S-METALLB-IN in
 exit-address-family
 !
exit
!
! ----------------------------
! Proxmox accepted prefixes
! ----------------------------
ip prefix-list PVE-PREFIXES seq 10 permit 10.0.0.0/16 ge 24 le 24
ip prefix-list PVE-PREFIXES seq 20 permit 10.127.0.0/24 le 32
ip prefix-list PVE-PREFIXES seq 999 deny 0.0.0.0/0 le 32
!
ip prefix-list METALLB-LB-POOL seq 10 permit 10.127.0.0/24 le 32
ip prefix-list METALLB-LB-POOL seq 999 deny 0.0.0.0/0 le 32
!
! ----------------------------
! Prefer node1 over node2
! ----------------------------
route-map PVE-IN-PRIMARY permit 10
 match ip address prefix-list PVE-PREFIXES
 set local-preference 200
exit
!
route-map PVE-IN-PRIMARY deny 999
exit
!
route-map PVE-IN-STANDBY permit 10
 match ip address prefix-list PVE-PREFIXES
 set local-preference 100
exit
!
route-map PVE-IN-STANDBY deny 999
exit
!
route-map K8S-METALLB-IN permit 10
 match ip address prefix-list METALLB-LB-POOL
 set local-preference 300
exit
!
route-map K8S-METALLB-IN deny 999
exit
!
