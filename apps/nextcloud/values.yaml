redis:
  enabled: true
internalDatabase:
  enabled: false
mariadb:
  enabled: false
externalDatabase:
  enabled: true
  type: postgresql
  host: nextcloud-postgres-rw
  database: nextcloud
  existingSecret:
    enabled: true
    secretName: nextcloud-postgres-app
    usernameKey: username
    passwordKey: password
persistence:
  storageClass: ceph-cephfs
  enabled: true
  accessMode: ReadWriteMany
  size: 100Gi
cronjob:
  enabled: true
hpa:
  enabled: false
startupProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 120
ingress:
  enabled: true
  className: cloudflare-tunnel
  annotations:
    kubernetes.io/ingress.class: cloudflare-tunnel
nextcloud:
  host: "nextcloud.akatuki-host.com"
  existingSecret:
    enabled: true
    secretName: nextcloud-admin
    usernameKey: nextcloud-username
    passwordKey: nextcloud-password
  trustedDomains:
    - "nextcloud.akatuki-host.com"
  extraEnv:
    - name: NEXTCLOUD_OIDC_CLIENT_ID
      value: "nextcloud"
    - name: NEXTCLOUD_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: nextcloud-oidc-client-secret
          key: client-secret
    - name: NEXTCLOUD_OIDC_DISCOVERY_URL
      value: "https://auth.akatuki-host.com/application/o/nextcloud/.well-known/openid-configuration"
  extraInitContainers:
    - name: wait-for-postgres
      image: ghcr.io/cloudnative-pg/postgresql:18.0-system-trixie
      command:
        - sh
        - -ec
        - |
          until pg_isready -h nextcloud-postgres-rw -p 5432 -d nextcloud -U nextcloud; do
            sleep 2
          done
  configs:
    trusted_proxy.config.php: |
      <?php
      $CONFIG = array (
        'trusted_domains' => [
          'nextcloud.akatuki-host.com',
        ],
        'trusted_proxies'   => [
          '10.244.0.0/16',
        ],
        'forwarded_for_headers' => ['HTTP_X_FORWARDED_FOR'],
        'overwriteprotocol' => 'https',
        'overwrite.cli.url' => 'https://nextcloud.akatuki-host.com/',
      );
    oidc.config.php: |
      <?php
      $CONFIG = array (
        'user_oidc' => array (
          'login_label' => 'Sign in with Authentik',
          'auto_provision' => true,
          'soft_auto_provision' => true,
          'disable_account_creation' => false,
          'single_logout' => true,
          'send_userinfo_claims' => false,
          'use_pkce' => true,
        ),
      );
  hooks:
    post-installation: |
      #!/bin/sh
      set -eu

      php occ app:install user_oidc || php occ app:enable user_oidc
      php occ app:install notes || php occ app:enable notes
      php occ app:install groupfolders || php occ app:enable groupfolders
      php occ user_oidc:provider authentik \
        --clientid="$NEXTCLOUD_OIDC_CLIENT_ID" \
        --clientsecret="$NEXTCLOUD_OIDC_CLIENT_SECRET" \
        --discoveryuri="$NEXTCLOUD_OIDC_DISCOVERY_URL" \
        --group-provisioning=1 \
        --group-whitelist-regex='/^app:nextcloud:.*$/' \
        --group-restrict-login-to-whitelist=1
      php occ config:app:set --type=string --value=0 user_oidc allow_multiple_user_backends
      for app in serverinfo password_policy sharebymail support twofactor_totp weather_status; do
        php occ app:disable "$app"
      done
    pre-upgrade: |
      #!/bin/sh
      set -eu

      php occ maintenance:mode --on
    post-upgrade: |
      #!/bin/sh
      set -eu

      # Leave maintenance mode enabled on any failure for safe recovery.
      php occ upgrade
      php occ app:update --all
      php occ upgrade
      php occ maintenance:repair
      php occ maintenance:mode --off
