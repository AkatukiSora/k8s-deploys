apiVersion: batch/v1
kind: Job
metadata:
  name: nextcloud-initial-install
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: install
          image: docker.io/library/nextcloud:33.0.5-apache
          command:
            - sh
            - -ec
            - |
              if php occ status --output=json | grep -q '"installed":true'; then
                exit 0
              fi
              until php occ maintenance:install \
                --database pgsql \
                --database-host "$POSTGRES_HOST" \
                --database-name "$POSTGRES_DB" \
                --database-user "$POSTGRES_USER" \
                --database-pass "$POSTGRES_PASSWORD" \
                --admin-user "$NEXTCLOUD_ADMIN_USER" \
                --admin-pass "$NEXTCLOUD_ADMIN_PASSWORD" \
                --data-dir /var/www/html/data; do
                sleep 5
              done
              php occ app:install user_oidc || php occ app:enable user_oidc
              php occ user_oidc:provider authentik \
                --clientid="$NEXTCLOUD_OIDC_CLIENT_ID" \
                --clientsecret="$NEXTCLOUD_OIDC_CLIENT_SECRET" \
                --discoveryuri="$NEXTCLOUD_OIDC_DISCOVERY_URL" \
                --group-provisioning=1 \
                --group-whitelist-regex='/^(app:nextcloud:global:admin|app:nextcloud:global:user|app:nextcloud:global:group-admin)$/' \
                --group-restrict-login-to-whitelist=1
              php occ config:app:set --type=string --value=0 user_oidc allow_multiple_user_backends
          env:
            - name: POSTGRES_HOST
              value: nextcloud-postgres-rw
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-postgres-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-postgres-app
                  key: password
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-admin
                  key: nextcloud-username
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-admin
                  key: nextcloud-password
            - name: NEXTCLOUD_OIDC_CLIENT_ID
              value: nextcloud
            - name: NEXTCLOUD_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nextcloud-oidc-client-secret
                  key: client-secret
            - name: NEXTCLOUD_OIDC_DISCOVERY_URL
              value: https://auth.akatuki-host.com/application/o/nextcloud/.well-known/openid-configuration
          volumeMounts:
            - name: nextcloud-data
              mountPath: /var/www/html
      volumes:
        - name: nextcloud-data
          persistentVolumeClaim:
            claimName: nextcloud-nextcloud
