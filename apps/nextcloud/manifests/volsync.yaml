apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: nextcloud-data
  namespace: nextcloud
spec:
  sourcePVC: nextcloud-nextcloud
  trigger:
    schedule: "30 */6 * * *"
  restic:
    repository: volsync-restic-nextcloud-data
    copyMethod: Snapshot
    storageClassName: ceph-rbd
    volumeSnapshotClassName: csi-cephfsplugin-snapclass
    cacheCapacity: 1Gi
    cacheStorageClassName: ceph-rbd
    pruneIntervalDays: 7
    retain:
      daily: 7
      weekly: 5
      monthly: 6
