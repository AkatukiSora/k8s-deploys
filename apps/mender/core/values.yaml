global:
  enterprise: false
  hosted: false
  url: https://mender.sora-lab.dev
  mongodb:
    existingSecret: mender-mongodb-connection
  s3:
    existingSecret: mender-artifacts-b2
    AWS_URI: https://s3.us-west-004.backblazeb2.com
    AWS_EXTERNAL_URI: https://s3.us-west-004.backblazeb2.com
    AWS_BUCKET: sora-lab-mender
    AWS_REGION: us-west-004
    AWS_ACCESS_KEY_ID: ""
    AWS_SECRET_ACCESS_KEY: ""
    AWS_FORCE_PATH_STYLE: "true"
    AWS_TAG_ARTIFACT: "true"

mongodb:
  enabled: false
ingress:
  enabled: false
api_gateway:
  storage_proxy:
    enabled: false

deployments:
  customEnvs:
    - name: DEPLOYMENTS_MONGO
      valueFrom:
        secretKeyRef:
          name: mender-mongodb-connection
          key: connectionString.standard
    - name: DEPLOYMENTS_MONGO_URL
      valueFrom:
        secretKeyRef:
          name: mender-mongodb-connection
          key: connectionString.standard
    - name: DEPLOYMENTS_AWS_AUTH_KEY
      valueFrom:
        secretKeyRef:
          name: mender-artifacts-b2
          key: AWS_ACCESS_KEY_ID
    - name: DEPLOYMENTS_AWS_AUTH_SECRET
      valueFrom:
        secretKeyRef:
          name: mender-artifacts-b2
          key: AWS_SECRET_ACCESS_KEY
    - name: DEPLOYMENTS_AWS_BUCKET
      valueFrom:
        configMapKeyRef:
          name: mender-artifacts-b2
          key: BUCKET_NAME
    - name: DEPLOYMENTS_STORAGE_BUCKET
      valueFrom:
        configMapKeyRef:
          name: mender-artifacts-b2
          key: BUCKET_NAME
    - name: DEPLOYMENTS_AWS_URI
      value: https://s3.us-west-004.backblazeb2.com
    - name: DEPLOYMENTS_AWS_EXTERNAL_URI
      value: https://s3.us-west-004.backblazeb2.com
    - name: DEPLOYMENTS_AWS_REGION
      value: us-west-004
    - name: DEPLOYMENTS_AWS_FORCE_PATH_STYLE
      value: "true"
    - name: DEPLOYMENTS_STORAGE_ENABLE_DIRECT_UPLOAD
      value: "true"
    - name: DEPLOYMENTS_AWS_TAG_ARTIFACT
      value: "true"

create_artifact_worker:
  customEnvs:
    - name: WORKFLOWS_MONGO
      valueFrom:
        secretKeyRef:
          name: mender-mongodb-connection
          key: connectionString.standard
    - name: WORKFLOWS_MONGO_URL
      valueFrom:
        secretKeyRef:
          name: mender-mongodb-connection
          key: connectionString.standard

device_auth:
  customEnvs:
    - name: DEVICEAUTH_MONGO
      valueFrom: &mongoRef
        secretKeyRef:
          name: mender-mongodb-connection
          key: connectionString.standardSrv
    - name: DEVICEAUTH_MONGO_URL
      valueFrom: *mongoRef
deviceconfig:
  customEnvs:
    - name: DEVICECONFIG_MONGO
      valueFrom: *mongoRef
    - name: DEVICECONFIG_MONGO_URL
      valueFrom: *mongoRef
deviceconnect:
  customEnvs:
    - name: DEVICECONNECT_MONGO
      valueFrom: *mongoRef
    - name: DEVICECONNECT_MONGO_URL
      valueFrom: *mongoRef
inventory:
  customEnvs:
    - name: INVENTORY_MONGO
      valueFrom: *mongoRef
    - name: INVENTORY_MONGO_URL
      valueFrom: *mongoRef
iot_manager:
  customEnvs:
    - name: IOT_MANAGER_MONGO
      valueFrom: *mongoRef
    - name: IOT_MANAGER_MONGO_URL
      valueFrom: *mongoRef
useradm:
  customEnvs:
    - name: USERADM_MONGO
      valueFrom: *mongoRef
    - name: USERADM_MONGO_URL
      valueFrom: *mongoRef
workflows:
  customEnvs:
    - name: WORKFLOWS_MONGO
      valueFrom: *mongoRef
    - name: WORKFLOWS_MONGO_URL
      valueFrom: *mongoRef

# The chart's envFrom entries remain enabled for compatibility. Kubernetes
# explicit env entries take precedence over envFrom entries with the same name.
