apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mongodb-database
  namespace: mender
rules:
  - apiGroups: [""]
    resources:
      - secrets
    resourceNames:
      - mender-mongodb-config
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongodb-database
  namespace: mender
subjects:
  - kind: ServiceAccount
    name: mongodb-database
    namespace: mender
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mongodb-database
