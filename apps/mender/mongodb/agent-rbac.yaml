apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mongodb-database
  namespace: mender
rules:
  # The agent readiness probe reads its own Pod to determine agent health.
  - apiGroups: [""]
    resources:
      - pods
    resourceNames:
      - mender-mongodb-0
    verbs:
      - get
      - patch
  # The agent mounts the AutomationConfig Secret generated by the operator.
  - apiGroups: [""]
    resources:
      - secrets
    resourceNames:
      - mender-mongodb-config
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongodb-database
  namespace: mender
subjects:
  - kind: ServiceAccount
    name: mongodb-database
    namespace: mender
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mongodb-database
