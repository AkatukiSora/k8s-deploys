apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: mender-mongodb
  namespace: mender
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  members: 1
  type: ReplicaSet
  # MongoDB 8.0 is supported by the pinned Community Operator v0.13.0.
  version: "8.0.12"
  security:
    authentication:
      modes:
        - SCRAM
  users:
    - name: mender
      db: admin
      passwordSecretRef:
        name: mender-mongodb-password
        key: password
      scramCredentialsSecretName: mender-mongodb-scram-credentials
      connectionStringSecretName: mender-mongodb-connection
      connectionStringSecretNamespace: mender
      roles:
        - name: readWrite
          db: deployments
        - name: readWrite
          db: deviceauth
        - name: readWrite
          db: deviceconfig
        - name: readWrite
          db: deviceconnect
        - name: readWrite
          db: inventory
        - name: readWrite
          db: iot_manager
        - name: readWrite
          db: useradm
        - name: readWrite
          db: workflows
  statefulSet:
    spec:
      template:
        spec:
          nodeSelector:
            workload.sora-lab.dev/mongodb-avx2: "true"
      volumeClaimTemplates:
        - metadata:
            name: data-volume
          spec:
            storageClassName: ceph-rbd
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi
