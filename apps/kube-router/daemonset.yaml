---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-router
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-router
    app.kubernetes.io/component: service-proxy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-router
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-router
        app.kubernetes.io/component: service-proxy
    spec:
      serviceAccountName: kube-router
      hostNetwork: true
      hostPID: true
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      initContainers:
        - name: cleanup-kube-proxy
          image: registry.k8s.io/kube-proxy:v1.36.2
          command:
            - /bin/sh
            - -ec
            - |
              while true; do
                found=false
                for proc in /proc/[0-9]*; do
                  process_name=$(cat "$proc/comm" 2>/dev/null || true)
                  if [ "$process_name" = kube-proxy ]; then
                    found=true
                    break
                  fi
                done
                [ "$found" = false ] && break
                sleep 1
              done
              kube-proxy --cleanup --proxy-mode=nftables
          securityContext:
            privileged: true
          volumeMounts:
            - name: xtables-lock
              mountPath: /run/xtables.lock
      containers:
        - name: kube-router
          image: docker.io/cloudnativelabs/kube-router:v2.10.0
          # Cleanup runs after kube-router exits so kube-proxy can
          # reclaim rules.
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cleanup() {
                kill -TERM "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                kube-router --cleanup-config
                exit 0
              }
              trap cleanup INT TERM
              kube-router "$@" &
              pid=$!
              wait "$pid"
              status=$?
              kube-router --cleanup-config
              cleanup_status=$?
              [ "$status" -ne 0 ] && exit "$status"
              exit "$cleanup_status"
            - kube-router
            - --run-service-proxy=true
              - --run-router=false
              - --run-firewall=false
              - --enable-cni=false
              - --loadbalancer-ip-range=10.127.0.0/24
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: 20244
            initialDelaySeconds: 10
            periodSeconds: 3
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: 20244
            initialDelaySeconds: 10
            periodSeconds: 3
          securityContext:
            privileged: true
          volumeMounts:
            - name: modules
              mountPath: /lib/modules
              readOnly: true
            - name: xtables-lock
              mountPath: /run/xtables.lock
      volumes:
        - name: modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
