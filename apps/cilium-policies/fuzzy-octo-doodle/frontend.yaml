apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-frontend
  namespace: fuzzy-octo-doodle
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cloudflare-tunnel-ingress-controller
        app: controlled-cloudflared-connector
    toPorts:
    - ports:
      - port: '3000'
        protocol: TCP
