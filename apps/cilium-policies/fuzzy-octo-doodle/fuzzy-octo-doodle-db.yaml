apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-fuzzy-octo-doodle-db
  namespace: fuzzy-octo-doodle
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: fuzzy-octo-doodle-db
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cnpg-system
        app.kubernetes.io/instance: cloudnative-pg
        app.kubernetes.io/name: cloudnative-pg
    toPorts:
    - ports:
      - port: '8000'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: fuzzy-octo-doodle
        app.kubernetes.io/name: backend
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: fuzzy-octo-doodle
        app.kubernetes.io/name: backend-jobs
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: fuzzy-octo-doodle
        app.kubernetes.io/name: migrate
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: fuzzy-octo-doodle
        app.kubernetes.io/name: seed
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: fuzzy-octo-doodle
        cnpg.io/cluster: fuzzy-octo-doodle-db
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
      - port: '8000'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        app.kubernetes.io/instance: kube-prometheus-stack-prometheus
        app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: '9187'
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: fuzzy-octo-doodle
        cnpg.io/cluster: fuzzy-octo-doodle-db
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
      - port: '8000'
        protocol: TCP
