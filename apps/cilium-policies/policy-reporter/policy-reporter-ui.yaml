# The policy-reporter UI keeps a connection to the API server and proxies
# requests to the policy-reporter backend. It crash-loops without them.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-policy-reporter-ui
  namespace: policy-reporter
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: security-policy-reporter
      app.kubernetes.io/name: policy-reporter-ui
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: policy-reporter
            app.kubernetes.io/instance: security-policy-reporter
            app.kubernetes.io/name: policy-reporter
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-policy-reporter-from-ui
  namespace: policy-reporter
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: security-policy-reporter
      app.kubernetes.io/name: policy-reporter
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: policy-reporter
            app.kubernetes.io/instance: security-policy-reporter
            app.kubernetes.io/name: policy-reporter-ui
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
