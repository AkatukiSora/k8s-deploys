apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-mender-core-iot-manager
  namespace: mender
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: iot-manager
      app.kubernetes.io/instance: mender-core
      app.kubernetes.io/name: mender-core-iot-manager
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: mender
        app: mender-mongodb-svc
    toPorts:
    - ports:
      - port: '27017'
        protocol: TCP
