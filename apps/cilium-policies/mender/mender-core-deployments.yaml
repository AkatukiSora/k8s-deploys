apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-mender-core-deployments
  namespace: mender
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: deployments
      app.kubernetes.io/instance: mender-core
      app.kubernetes.io/name: mender-core-deployments
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: mender
        app: mender-mongodb-svc
    toPorts:
    - ports:
      - port: '27017'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: mender
        app.kubernetes.io/component: inventory
        app.kubernetes.io/instance: mender-core
        app.kubernetes.io/name: mender-core-inventory
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: mender
        app.kubernetes.io/component: workflows-server
        app.kubernetes.io/instance: mender-core
        app.kubernetes.io/name: mender-core-workflows-server
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
