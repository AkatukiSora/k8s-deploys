apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-controlled-cloudflared-connector
  namespace: cloudflare-tunnel-ingress-controller
spec:
  endpointSelector:
    matchLabels:
      app: controlled-cloudflared-connector
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: argocd
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: argocd
        app.kubernetes.io/name: argocd-server
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: argocd
        app.kubernetes.io/name: argocd-image-updater
    toPorts:
    - ports:
      - port: '8082'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: authentik
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: authentik
        app.kubernetes.io/name: authentik
    toPorts:
    - ports:
      - port: '9000'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: bunkasai-ticket
        app.kubernetes.io/component: api
        app.kubernetes.io/name: bunkasai-ticket
    toPorts:
    - ports:
      - port: '8787'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: caddy-test
        app: caddy
    toPorts:
    - ports:
      - port: '80'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: coder
        app.kubernetes.io/instance: coder
        app.kubernetes.io/name: coder
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: fuzzy-octo-doodle
        app.kubernetes.io/name: backend
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: fuzzy-octo-doodle
        app.kubernetes.io/name: frontend
    toPorts:
    - ports:
      - port: '3000'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: immich
        app.kubernetes.io/instance: immich
        app.kubernetes.io/name: server
    toPorts:
    - ports:
      - port: '2283'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        app.kubernetes.io/instance: kube-prometheus-stack
        app.kubernetes.io/name: grafana
    toPorts:
    - ports:
      - port: '3000'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: nextcloud
        app.kubernetes.io/component: app
        app.kubernetes.io/instance: nextcloud
        app.kubernetes.io/name: nextcloud
    toPorts:
    - ports:
      - port: '80'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: vikunja
        app.kubernetes.io/instance: vikunja
        app.kubernetes.io/name: vikunja
    toPorts:
    - ports:
      - port: '3456'
        protocol: TCP
