apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-caddy
  namespace: caddy-test
spec:
  endpointSelector:
    matchLabels:
      app: caddy
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cloudflare-tunnel-ingress-controller
        app: controlled-cloudflared-connector
    toPorts:
    - ports:
      - port: '80'
        protocol: TCP
