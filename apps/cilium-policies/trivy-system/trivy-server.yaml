apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-trivy-server
  namespace: trivy-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: trivy-server
      app.kubernetes.io/name: trivy-server
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: trivy-system
        app.kubernetes.io/instance: security-trivy-operator
        app.kubernetes.io/name: trivy-operator
    toPorts:
    - ports:
      - port: '4954'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: trivy-system
        app.kubernetes.io/managed-by: trivy-operator
    toPorts:
    - ports:
      - port: '4954'
        protocol: TCP
