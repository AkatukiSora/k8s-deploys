apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-onepassword-connect
  namespace: 1password
spec:
  endpointSelector:
    matchLabels:
      app: onepassword-connect
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: 1password
        app.kubernetes.io/component: operator
        name: onepassword-connect
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
