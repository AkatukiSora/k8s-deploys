apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-onepassword-connect-operator
  namespace: 1password
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: operator
      name: onepassword-connect
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: 1password
        app: onepassword-connect
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
