apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-bunkasai-ticket-postgres
  namespace: bunkasai-ticket
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: bunkasai-ticket-postgres
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: bunkasai-ticket
        app.kubernetes.io/component: api
        app.kubernetes.io/name: bunkasai-ticket
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: bunkasai-ticket
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/name: bunkasai-ticket
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: bunkasai-ticket
        app.kubernetes.io/component: migration
        app.kubernetes.io/name: bunkasai-ticket
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: bunkasai-ticket
        cnpg.io/cluster: bunkasai-ticket-postgres
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
      - port: '8000'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cnpg-system
        app.kubernetes.io/instance: cloudnative-pg
        app.kubernetes.io/name: cloudnative-pg
    toPorts:
    - ports:
      - port: '8000'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        app.kubernetes.io/instance: kube-prometheus-stack-prometheus
        app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: '9187'
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: bunkasai-ticket
        cnpg.io/cluster: bunkasai-ticket-postgres
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
      - port: '8000'
        protocol: TCP
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '6443'
        protocol: TCP
