# Egress to the Kubernetes API server (TCP/6443) for workloads that keep
# long-lived watch connections. Such connections never produce AUDIT verdicts
# while they stay open, so they were missed in the observation period.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-cnpg-instance-apiserver-egress
spec:
  description: CloudNativePG instance managers watch and update their Cluster resources through the API server.
  endpointSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
