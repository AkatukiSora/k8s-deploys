# Outbound internet access (TCP 443, plus UDP 7844 for the Cloudflare tunnel connector).
# Kept in one file on purpose: when an egress proxy is introduced, replace these
# policies with a rule that only allows traffic to the proxy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-world-egress-onepassword-connect
  namespace: 1password
spec:
  endpointSelector:
    matchLabels:
      app: onepassword-connect
  egress:
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP
---
