apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-coder
  namespace: coder
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: coder
      app.kubernetes.io/name: coder
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cloudflare-tunnel-ingress-controller
        app: controlled-cloudflared-connector
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: coder
        cnpg.io/cluster: coder-postgres
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
