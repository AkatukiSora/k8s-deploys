apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-nextcloud
  namespace: nextcloud
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: app
      app.kubernetes.io/instance: nextcloud
      app.kubernetes.io/name: nextcloud
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cloudflare-tunnel-ingress-controller
        app: controlled-cloudflared-connector
    toPorts:
    - ports:
      - port: '80'
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: nextcloud
        app.kubernetes.io/component: master
        app.kubernetes.io/instance: nextcloud
        app.kubernetes.io/name: redis
    toPorts:
    - ports:
      - port: '6379'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: nextcloud
        cnpg.io/cluster: nextcloud-postgres
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
