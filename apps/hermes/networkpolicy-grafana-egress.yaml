apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: allow-grafana-api-egress
  namespace: hermes
spec:
  egress:
    - ports:
        # Permit both the ClusterIP Service port and its resolved Pod port.
        # CNIs differ in whether policy evaluation observes pre- or post-DNAT.
        - port: 80
          protocol: TCP
        - port: 3000
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: kube-prometheus-stack
              app.kubernetes.io/name: grafana
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  policyTypes:
    - Egress
