apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: hermes-data
  namespace: hermes
spec:
  sourcePVC: hermes-data
  trigger:
    schedule: "30 */6 * * *"
  restic:
    repository: volsync-restic-hermes-data
    copyMethod: Snapshot
    storageClassName: ceph-rbd
    volumeSnapshotClassName: csi-rbdplugin-snapclass
    moverSecurityContext:
      runAsUser: 10000
      runAsGroup: 10000
      fsGroup: 10000
    cacheCapacity: 8Gi
    cacheStorageClassName: ceph-rbd
    pruneIntervalDays: 7
    retain:
      daily: 7
      weekly: 5
      monthly: 6
