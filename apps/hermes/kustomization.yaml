apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - pvc.yaml
  - onepassworditem-discord.yaml
  - onepassworditem-github-app.yaml
  - rbac-k8s-observer.yaml
  - networkpolicy-default-deny.yaml
  - networkpolicy-dns-egress.yaml
  - networkpolicy-public-https-egress.yaml
  - networkpolicy-kubernetes-api-egress.yaml
  - deployment.yaml
configMapGenerator:
  - name: hermes-config
    files:
      - config.yaml
      - SOUL.md
  - name: hermes-github-tools
    files:
      - github-tools/token-broker.sh
      - github-tools/git-credential-hermes
      - github-tools/gh
      - github-tools/github-commit-staged
      - github-tools/terminal-path.sh
  - name: hermes-kubernetes-config
    files:
      - kubeconfig=kubernetes/kubeconfig
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/instance: hermes
    app.kubernetes.io/name: hermes
