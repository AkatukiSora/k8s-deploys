apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - pvc.yaml
  - pvc-google-secretary.yaml
  - service-webhook.yaml
  - onepassworditem-discord.yaml
  - onepassworditem-github-app.yaml
  - onepassworditem-alertmanager-webhook.yaml
  - onepassworditem-argocd.yaml
  - onepassworditem-grafana.yaml
  - onepassworditem-vikunja.yaml
  - onepassworditem-google-oauth-client.yaml
  - rbac-k8s-observer.yaml
  - networkpolicy-default-deny.yaml
  - networkpolicy-dns-egress.yaml
  - networkpolicy-public-https-egress.yaml
  - networkpolicy-kubernetes-api-egress.yaml
  - networkpolicy-argocd-egress.yaml
  - networkpolicy-grafana-egress.yaml
  - networkpolicy-alertmanager-webhook-ingress.yaml
  - deployment.yaml
configMapGenerator:
  - name: hermes-config
    files:
      - config.yaml
      - SOUL.md
  - name: hermes-github-tools
    files:
      - github-tools/token-broker.sh
      - github-tools/git-credential-hermes
      - github-tools/gh
      - github-tools/github-commit-staged
      - github-tools/terminal-path.sh
  - name: hermes-vikunja-adapter
    files:
      - vikunja-adapter/server.py
  - name: hermes-vikunja-tools
    files:
      - vikunja-tasks=vikunja-tools/vikunja-tasks
  - name: hermes-google-oauth-broker
    files:
      - google-oauth-broker/server.py
    options:
      labels:
        app.kubernetes.io/component: google-read-adapter
  - name: hermes-google-oauth-tools
    files:
      - google-secretary-auth=google-oauth-tools/google-secretary-auth
    options:
      labels:
        app.kubernetes.io/component: google-read-adapter
  - name: hermes-kubernetes-config
    files:
      - kubeconfig=kubernetes/kubeconfig
  - name: hermes-observability-tools
    files:
      - observability-tools/grafana-read
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/instance: hermes
    app.kubernetes.io/name: hermes
