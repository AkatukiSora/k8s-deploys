apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - pvc.yaml
  - onepassworditem-discord.yaml
  - networkpolicy-default-deny.yaml
  - networkpolicy-dns-egress.yaml
  - networkpolicy-public-https-egress.yaml
  - deployment.yaml
configMapGenerator:
  - name: hermes-config
    files:
      - config.yaml
      - SOUL.md
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/instance: hermes
    app.kubernetes.io/name: hermes
