apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: allow-proxmox-api-egress
  namespace: hermes
spec:
  egress:
    # The Proxmox VE API on a single cluster node. Any node of the cluster
    # answers for the whole cluster; to add a standby node later, append its
    # /32 here and update PROXMOX_HOST.
    - ports:
        - port: 8006
          protocol: TCP
      to:
        - ipBlock:
            cidr: 192.168.6.100/32
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  policyTypes:
    - Egress
