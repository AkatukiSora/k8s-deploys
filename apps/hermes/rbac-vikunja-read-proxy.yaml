apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: hermes-vikunja-read-proxy
  namespace: hermes
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["hermes-vikunja-read"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: hermes-vikunja-read-proxy
  namespace: hermes
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: hermes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-vikunja-read-proxy
