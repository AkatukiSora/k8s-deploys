apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/instance: hermes
    app.kubernetes.io/name: hermes
  name: hermes
  namespace: hermes
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      annotations:
        checksum/hermes-vikunja-adapter: ea06d8d5cd3ebe749ea5b6797ad514e1c29a62e935fd38ebf4d7f98824dfb0cd
        checksum/hermes-vikunja-tools: 37684218132f8595aca4f776937bbb10fc51e8fd2424142466dcae7a329ac610
        checksum/hermes-google-oauth-broker: df3a7cd5b517fde07aeb26ee062ecd849ad72c21349f6d87526c3d5a0f8a2f9f
        checksum/hermes-google-oauth-tools: a9f6e8f2174c2a7cb73e6206af4505a77502d762156ca89b7461ddbfa16be53a
      labels:
        app.kubernetes.io/instance: hermes
        app.kubernetes.io/name: hermes
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: bootstrap-config
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              umask 077
              state=/opt/data/.hermes-bootstrap-recovery-v1
              token=hermes-bootstrap-recovery-v1

              for file in config.yaml SOUL.md; do
                source="/bootstrap/$file"
                destination="/opt/data/$file"
                if [ ! -r "$source" ] || [ ! -f "$source" ]; then
                  echo "missing bootstrap file: $source" >&2
                  exit 1
                fi
                if [ -L "$destination" ] || [ ! -f "$destination" ]; then
                  echo "destination must be a regular non-symlink file:" >&2
                  echo "$destination" >&2
                  exit 1
                fi
              done

              if [ -e "$state" ] || [ -L "$state" ]; then
                if [ -L "$state" ] || [ ! -d "$state" ]; then
                  echo "migration state must be a directory" >&2
                  exit 1
                fi
                for file in config.yaml SOUL.md; do
                  backup="$state/$file.before"
                  if [ -L "$backup" ] || [ ! -f "$backup" ]; then
                    echo "missing regular migration backup: $backup" >&2
                    exit 1
                  fi
                done
                if [ -L "$state/.complete" ] || [ ! -f "$state/.complete" ] || \
                  ! printf '%s\n' "$token" | cmp -s - "$state/.complete"; then
                  echo "migration state is incomplete or malformed" >&2
                  exit 1
                fi
                for entry in "$state"/* "$state"/.[!.]* "$state"/..?*; do
                  [ -e "$entry" ] || continue
                  case "$entry" in
                    "$state/config.yaml.before"|\
                    "$state/SOUL.md.before"|\
                    "$state/.complete") ;;
                    *)
                      echo "unexpected migration state entry: $entry" >&2
                      exit 1
                      ;;
                  esac
                done
                exit 0
              fi

              mkdir "$state"
              chown 10000:10000 "$state"
              chmod 0700 "$state"

              for file in config.yaml SOUL.md; do
                destination="/opt/data/$file"
                backup_tmp="$state/$file.backup.tmp"
                cp "$destination" "$backup_tmp"
                chown 10000:10000 "$backup_tmp"
                chmod 0600 "$backup_tmp"
                mv "$backup_tmp" "$state/$file.before"
              done

              for file in config.yaml SOUL.md; do
                install_tmp="$state/$file.install.tmp"
                cp "/bootstrap/$file" "$install_tmp"
                chown 10000:10000 "$install_tmp"
                chmod 0640 "$install_tmp"
              done

              mv "$state/config.yaml.install.tmp" /opt/data/config.yaml
              mv "$state/SOUL.md.install.tmp" /opt/data/SOUL.md
              sync

              printf '%s\n' "$token" > "$state/.complete.tmp"
              chown 10000:10000 "$state/.complete.tmp"
              chmod 0440 "$state/.complete.tmp"
              mv "$state/.complete.tmp" "$state/.complete"
              sync
          image: "nousresearch/hermes-agent@sha256:\
            63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7"
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - mountPath: /bootstrap
              name: config
              readOnly: true
            - mountPath: /opt/data
              name: data
        - name: prepare-google-secretary-state
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              state=/var/lib/google-secretary
              if [ -L "$state" ] || [ ! -d "$state" ]; then
                echo "google secretary state must be a directory" >&2
                exit 1
              fi
              chown 10000:10000 "$state"
              chmod 0700 "$state"
          image: "nousresearch/hermes-agent@sha256:\
            63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7"
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 5m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - mountPath: /var/lib/google-secretary
              name: google-secretary-data
        - name: install-github-tools
          command:
            - /bin/sh
            - -ec
            - |
              set -eu

              gh_version=2.100.0
              case "$(uname -m)" in
                x86_64)
                  arch=amd64
                  gh_sha=e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be
                  ;;
                aarch64|arm64)
                  arch=arm64
                  gh_sha=ea4e7a581a32ccad6cc7923cb1576ac5859ba4b9a16ab22eb8f8a96e78e2e961
                  ;;
                *)
                  echo "unsupported architecture: $(uname -m)" >&2
                  exit 1
                  ;;
              esac

              download_verified() {
                url="$1"
                digest="$2"
                destination="$3"
                temporary="${destination}.tmp"

                rm -f "$temporary"
                curl -fsSL --retry 3 --retry-all-errors -o "$temporary" "$url"
                printf '%s  %s\n' "$digest" "$temporary" | sha256sum -c -
                mv "$temporary" "$destination"
              }

              has_expected_sha() {
                test -f "$2" &&
                  printf '%s  %s\n' "$1" "$2" | sha256sum -c - >/dev/null 2>&1
              }

              has_expected_gh_version() {
                test -x "$1" &&
                  "$1" --version | grep -Fq "gh version $2 "
              }

              gh=/opt/github-bin/gh
              if ! has_expected_gh_version "$gh" "$gh_version"; then
                archive=/opt/github-bin/gh.tar.gz
                extract=/opt/github-bin/.gh-extract
                gh_tmp="${gh}.tmp"
                download_verified \
                  "https://github.com/cli/cli/releases/download/v${gh_version}/gh_${gh_version}_linux_${arch}.tar.gz" \
                  "$gh_sha" \
                  "$archive"
                rm -rf "$extract" "$gh_tmp"
                mkdir "$extract"
                tar --no-same-owner -xzf "$archive" -C "$extract"
                install -m 0555 \
                  "$extract/gh_${gh_version}_linux_${arch}/bin/gh" \
                  "$gh_tmp"
                mv "$gh_tmp" "$gh"
                rm -rf "$archive" "$extract"
              fi
          image: "nousresearch/hermes-agent@sha256:\
            63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7"
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - mountPath: /opt/github-bin
              name: github-bin
        - name: install-kubectl
          command:
            - /bin/sh
            - -ec
            - |
              set -eu

              kubectl_version=v1.36.2
              case "$(uname -m)" in
                x86_64)
                  arch=amd64
                  kubectl_sha=1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82
                  ;;
                aarch64|arm64)
                  arch=arm64
                  kubectl_sha=c957eb8c4bea27a3bb35b269edd9082e27f027f7b76b20b5bf4afebc726c6d3e
                  ;;
                *)
                  echo "unsupported architecture: $(uname -m)" >&2
                  exit 1
                  ;;
              esac

              kubectl=/opt/kubernetes-bin/kubectl
              temporary="${kubectl}.tmp"
              rm -f "$temporary"
              curl -fsSL --retry 3 --retry-all-errors \
                -o "$temporary" \
                "https://dl.k8s.io/release/${kubectl_version}/bin/linux/${arch}/kubectl"
              printf '%s  %s\n' "$kubectl_sha" "$temporary" | sha256sum -c -
              install -m 0555 "$temporary" "$kubectl"
              rm -f "$temporary"
          image: "nousresearch/hermes-agent@sha256:\
            63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7"
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - mountPath: /opt/kubernetes-bin
              name: kubernetes-bin
        - name: install-argocd
          command:
            - /bin/sh
            - -ec
            - |
              set -eu

              argocd_version=v3.4.5
              case "$(uname -m)" in
                x86_64)
                  arch=amd64
                  argocd_sha=23303f05a58c1e041324d5645b0f9d6ea338b16bbf32f4a24508f388fcf9f9c0
                  ;;
                aarch64|arm64)
                  arch=arm64
                  argocd_sha=f6c1baa8f10d12d8a7c61b81c8e8632a84cba0def0dcbc5082d8a45efa241168
                  ;;
                *)
                  echo "unsupported architecture: $(uname -m)" >&2
                  exit 1
                  ;;
              esac

              argocd=/opt/argocd-bin/argocd
              temporary="${argocd}.tmp"
              rm -f "$temporary"
              curl -fsSL --retry 3 --retry-all-errors \
                -o "$temporary" \
                "https://github.com/argoproj/argo-cd/releases/download/${argocd_version}/argocd-linux-${arch}"
              printf '%s  %s\n' "$argocd_sha" "$temporary" | sha256sum -c -
              install -m 0555 "$temporary" "$argocd"
              rm -f "$temporary"
          image: "nousresearch/hermes-agent@sha256:\
            63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7"
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - mountPath: /opt/argocd-bin
              name: argocd-bin
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: hermes
      terminationGracePeriodSeconds: 60
      containers:
        - name: hermes
          args:
            - gateway
            - run
          image: "nousresearch/hermes-agent@sha256:\
            63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7"
          imagePullPolicy: IfNotPresent
          env:
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-discord
                  key: DISCORD_BOT_TOKEN
            - name: DISCORD_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: hermes-discord
                  key: DISCORD_ALLOWED_USERS
            - name: ARGOCD_SERVER
              value: argocd-server.argocd.svc.cluster.local:80
            - name: ARGOCD_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-argocd
                  key: ARGOCD_AUTH_TOKEN
            - name: GRAFANA_URL
              value: >-
                http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-grafana
                  key: GRAFANA_SERVICE_ACCOUNT_TOKEN
            - name: HERMES_GITHUB_TOKEN_FILE
              value: /var/run/github-token/token
            - name: HERMES_MANAGED_DIR
              value: /etc/hermes-managed
            - name: KUBECONFIG
              value: /etc/hermes-kubernetes/kubeconfig
            - name: BASH_ENV
              value: /opt/hermes-tools/terminal-path.sh
            - name: PATH
              value: /opt/hermes-tools:/opt/github-bin:/opt/kubernetes-bin:/opt/argocd-bin:/opt/observability-tools:/opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: GIT_CONFIG_COUNT
              value: "2"
            - name: GIT_CONFIG_KEY_0
              value: credential.https://github.com.helper
            - name: GIT_CONFIG_VALUE_0
              value: /opt/hermes-tools/git-credential-hermes
            - name: GIT_CONFIG_KEY_1
              value: credential.https://github.com.useHttpPath
            - name: GIT_CONFIG_VALUE_1
              value: "true"
          ports:
            - containerPort: 8642
              name: gateway
              protocol: TCP
            - containerPort: 8644
              name: webhook
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - curl -fsS --max-time 3 http://127.0.0.1:8642/health >/dev/null
            failureThreshold: 3
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - curl -fsS --max-time 3 http://127.0.0.1:8642/health >/dev/null
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - KILL
                - SETGID
                - SETUID
              drop:
                - ALL
            privileged: false
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          startupProbe:
            failureThreshold: 30
            periodSeconds: 10
            exec:
              command:
                - /bin/sh
                - -ec
                - curl -fsS --max-time 3 http://127.0.0.1:8642/health >/dev/null
            timeoutSeconds: 3
          volumeMounts:
            - mountPath: /opt/data
              name: data
            - mountPath: /etc/hermes-managed
              name: config
              readOnly: true
            - mountPath: /opt/hermes-tools
              name: github-tools
              readOnly: true
            - mountPath: /opt/github-bin
              name: github-bin
              readOnly: true
            - mountPath: /opt/kubernetes-bin
              name: kubernetes-bin
              readOnly: true
            - mountPath: /opt/argocd-bin
              name: argocd-bin
              readOnly: true
            - mountPath: /opt/observability-tools
              name: observability-tools
              readOnly: true
            - mountPath: /etc/hermes-kubernetes
              name: kubernetes-config
              readOnly: true
            - mountPath: /var/run/hermes-kubernetes
              name: hermes-kubernetes-token
              readOnly: true
            - mountPath: /var/run/github-token
              name: github-token
              readOnly: true
        - name: vikunja-adapter
          command:
            - python3
            - /opt/vikunja-adapter/server.py
          image: "nousresearch/hermes-agent@sha256:\
            63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7"
          imagePullPolicy: IfNotPresent
          env:
            - name: VIKUNJA_BASE_URL
              value: https://vikunja.akatuki-host.com
            - name: VIKUNJA_TOKEN_FILE
              value: /var/run/vikunja-api/token
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - curl -fsS --max-time 3 http://127.0.0.1:8791/health >/dev/null
            failureThreshold: 3
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - curl -fsS --max-time 5 http://127.0.0.1:8791/ready >/dev/null
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 10000
            runAsNonRoot: true
            runAsUser: 10000
          volumeMounts:
            - mountPath: /opt/vikunja-adapter
              name: vikunja-adapter
              readOnly: true
            - mountPath: /var/run/vikunja-api
              name: vikunja-api-secret
              readOnly: true
        - name: google-oauth-broker
          command:
            - python3
            - /opt/google-oauth-broker/server.py
          image: "nousresearch/hermes-agent@sha256:\
            63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7"
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - curl -fsS --max-time 3 http://127.0.0.1:8792/health >/dev/null
            failureThreshold: 3
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - curl -fsS --max-time 3 http://127.0.0.1:8792/oauth/status >/dev/null
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 10000
            runAsNonRoot: true
            runAsUser: 10000
          volumeMounts:
            - mountPath: /opt/google-oauth-broker
              name: google-oauth-broker
              readOnly: true
            - mountPath: /var/run/google-oauth-client
              name: google-oauth-client-secret
              readOnly: true
            - mountPath: /var/lib/google-secretary
              name: google-secretary-data
        - name: github-token-broker
          command:
            - /bin/sh
            - /opt/hermes-tools/token-broker.sh
          image: "nousresearch/hermes-agent@sha256:\
            63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7"
          imagePullPolicy: IfNotPresent
          env:
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: hermes-github-app
                  key: appId
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: hermes-github-app
                  key: installationId
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 5m
              memory: 16Mi
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  test -s /var/run/github-token/token
                  test -s /var/run/github-token/expires_at
                  now="$(date +%s)"
                  expiry="$(cat /var/run/github-token/expires_at)"
                  test "$expiry" -gt "$((now + 60))"
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - mountPath: /opt/hermes-tools
              name: github-tools
              readOnly: true
            - mountPath: /var/run/github-app
              name: github-app-secret
              readOnly: true
            - mountPath: /var/run/github-token
              name: github-token
      volumes:
        - name: config
          configMap:
            name: hermes-config
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: google-secretary-data
          persistentVolumeClaim:
            claimName: hermes-google-secretary-data
        - name: github-tools
          projected:
            defaultMode: 0555
            sources:
              - configMap:
                  name: hermes-github-tools
              - configMap:
                  name: hermes-vikunja-tools
              - configMap:
                  name: hermes-google-oauth-tools
        - name: github-bin
          emptyDir: {}
        - name: kubernetes-bin
          emptyDir: {}
        - name: argocd-bin
          emptyDir: {}
        - name: observability-tools
          configMap:
            name: hermes-observability-tools
            defaultMode: 0555
        - name: vikunja-adapter
          configMap:
            name: hermes-vikunja-adapter
            defaultMode: 0555
        - name: vikunja-api-secret
          secret:
            secretName: hermes-vikunja
            defaultMode: 0440
            items:
              - key: token
                path: token
        - name: google-oauth-broker
          configMap:
            name: hermes-google-oauth-broker
            defaultMode: 0555
        - name: google-oauth-client-secret
          secret:
            secretName: hermes-google-oauth-client
            defaultMode: 0440
            items:
              - key: clientId
                path: clientId
              - key: clientSecret
                path: clientSecret
        - name: kubernetes-config
          configMap:
            name: hermes-kubernetes-config
        - name: hermes-kubernetes-token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  items:
                    - key: ca.crt
                      path: ca.crt
                  name: kube-root-ca.crt
        - name: github-token
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: github-app-secret
          secret:
            secretName: hermes-github-app
            defaultMode: 0400
            items:
              - key: privateKey
                path: privateKey
