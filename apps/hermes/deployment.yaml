apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/instance: hermes
    app.kubernetes.io/name: hermes
  name: hermes
  namespace: hermes
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: hermes
        app.kubernetes.io/name: hermes
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: bootstrap-config
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              umask 077
              state=/opt/data/.hermes-bootstrap-recovery-v1
              token=hermes-bootstrap-recovery-v1

              for file in config.yaml SOUL.md; do
                source="/bootstrap/$file"
                destination="/opt/data/$file"
                if [ ! -r "$source" ] || [ ! -f "$source" ]; then
                  echo "missing bootstrap file: $source" >&2
                  exit 1
                fi
                if [ -L "$destination" ] || [ ! -f "$destination" ]; then
                  echo "destination must be a regular non-symlink file:" >&2
                  echo "$destination" >&2
                  exit 1
                fi
              done

              if [ -e "$state" ] || [ -L "$state" ]; then
                if [ -L "$state" ] || [ ! -d "$state" ]; then
                  echo "migration state must be a directory" >&2
                  exit 1
                fi
                for file in config.yaml SOUL.md; do
                  backup="$state/$file.before"
                  if [ -L "$backup" ] || [ ! -f "$backup" ]; then
                    echo "missing regular migration backup: $backup" >&2
                    exit 1
                  fi
                done
                if [ -L "$state/.complete" ] || [ ! -f "$state/.complete" ] || \
                  ! printf '%s\n' "$token" | cmp -s - "$state/.complete"; then
                  echo "migration state is incomplete or malformed" >&2
                  exit 1
                fi
                for entry in "$state"/* "$state"/.[!.]* "$state"/..?*; do
                  [ -e "$entry" ] || continue
                  case "$entry" in
                    "$state/config.yaml.before"|\
                    "$state/SOUL.md.before"|\
                    "$state/.complete") ;;
                    *)
                      echo "unexpected migration state entry: $entry" >&2
                      exit 1
                      ;;
                  esac
                done
                exit 0
              fi

              mkdir "$state"
              chown 10000:10000 "$state"
              chmod 0700 "$state"

              for file in config.yaml SOUL.md; do
                destination="/opt/data/$file"
                backup_tmp="$state/$file.backup.tmp"
                cp "$destination" "$backup_tmp"
                chown 10000:10000 "$backup_tmp"
                chmod 0600 "$backup_tmp"
                mv "$backup_tmp" "$state/$file.before"
              done

              for file in config.yaml SOUL.md; do
                install_tmp="$state/$file.install.tmp"
                cp "/bootstrap/$file" "$install_tmp"
                chown 10000:10000 "$install_tmp"
                chmod 0640 "$install_tmp"
              done

              mv "$state/config.yaml.install.tmp" /opt/data/config.yaml
              mv "$state/SOUL.md.install.tmp" /opt/data/SOUL.md
              sync

              printf '%s\n' "$token" > "$state/.complete.tmp"
              chown 10000:10000 "$state/.complete.tmp"
              chmod 0440 "$state/.complete.tmp"
              mv "$state/.complete.tmp" "$state/.complete"
              sync
          image: "nousresearch/hermes-agent@sha256:\
            63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7"
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - mountPath: /bootstrap
              name: config
              readOnly: true
            - mountPath: /opt/data
              name: data
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: hermes
      terminationGracePeriodSeconds: 60
      containers:
        - name: hermes
          args:
            - gateway
            - run
          image: "nousresearch/hermes-agent@sha256:\
            63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7"
          imagePullPolicy: IfNotPresent
          env:
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-discord
                  key: DISCORD_BOT_TOKEN
            - name: DISCORD_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: hermes-discord
                  key: DISCORD_ALLOWED_USERS
          ports:
            - containerPort: 8642
              name: gateway
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - curl -fsS --max-time 3 http://127.0.0.1:8642/health >/dev/null
            failureThreshold: 3
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - curl -fsS --max-time 3 http://127.0.0.1:8642/health >/dev/null
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - KILL
                - SETGID
                - SETUID
              drop:
                - ALL
            privileged: false
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          startupProbe:
            failureThreshold: 30
            periodSeconds: 10
            exec:
              command:
                - /bin/sh
                - -ec
                - curl -fsS --max-time 3 http://127.0.0.1:8642/health >/dev/null
            timeoutSeconds: 3
          volumeMounts:
            - mountPath: /opt/data
              name: data
      volumes:
        - name: config
          configMap:
            name: hermes-config
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
