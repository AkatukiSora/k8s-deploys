apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/instance: hermes
    app.kubernetes.io/name: hermes
  name: hermes
  namespace: hermes
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: hermes
        app.kubernetes.io/name: hermes
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: bootstrap-config
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              umask 077
              state=/opt/data/.hermes-bootstrap-recovery-v1
              token=hermes-bootstrap-recovery-v1

              for file in config.yaml SOUL.md; do
                source="/bootstrap/$file"
                destination="/opt/data/$file"
                if [ ! -r "$source" ] || [ ! -f "$source" ]; then
                  echo "missing bootstrap file: $source" >&2
                  exit 1
                fi
                if [ -L "$destination" ] || [ ! -f "$destination" ]; then
                  echo "destination must be a regular non-symlink file:" >&2
                  echo "$destination" >&2
                  exit 1
                fi
              done

              if [ -e "$state" ] || [ -L "$state" ]; then
                if [ -L "$state" ] || [ ! -d "$state" ]; then
                  echo "migration state must be a directory" >&2
                  exit 1
                fi
                for file in config.yaml SOUL.md; do
                  backup="$state/$file.before"
                  if [ -L "$backup" ] || [ ! -f "$backup" ]; then
                    echo "missing regular migration backup: $backup" >&2
                    exit 1
                  fi
                done
                if [ -L "$state/.complete" ] || [ ! -f "$state/.complete" ] || \
                  ! printf '%s\n' "$token" | cmp -s - "$state/.complete"; then
                  echo "migration state is incomplete or malformed" >&2
                  exit 1
                fi
                for entry in "$state"/* "$state"/.[!.]* "$state"/..?*; do
                  [ -e "$entry" ] || continue
                  case "$entry" in
                    "$state/config.yaml.before"|\
                    "$state/SOUL.md.before"|\
                    "$state/.complete") ;;
                    *)
                      echo "unexpected migration state entry: $entry" >&2
                      exit 1
                      ;;
                  esac
                done
                exit 0
              fi

              mkdir "$state"
              chown 10000:10000 "$state"
              chmod 0700 "$state"

              for file in config.yaml SOUL.md; do
                destination="/opt/data/$file"
                backup_tmp="$state/$file.backup.tmp"
                cp "$destination" "$backup_tmp"
                chown 10000:10000 "$backup_tmp"
                chmod 0600 "$backup_tmp"
                mv "$backup_tmp" "$state/$file.before"
              done

              for file in config.yaml SOUL.md; do
                install_tmp="$state/$file.install.tmp"
                cp "/bootstrap/$file" "$install_tmp"
                chown 10000:10000 "$install_tmp"
                chmod 0640 "$install_tmp"
              done

              mv "$state/config.yaml.install.tmp" /opt/data/config.yaml
              mv "$state/SOUL.md.install.tmp" /opt/data/SOUL.md
              sync

              printf '%s\n' "$token" > "$state/.complete.tmp"
              chown 10000:10000 "$state/.complete.tmp"
              chmod 0440 "$state/.complete.tmp"
              mv "$state/.complete.tmp" "$state/.complete"
              sync
          image: "nousresearch/hermes-agent@sha256:\
            63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7"
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - mountPath: /bootstrap
              name: config
              readOnly: true
            - mountPath: /opt/data
              name: data
        - name: install-github-tools
          command:
            - /bin/sh
            - -ec
            - |
              set -eu

              helper_version=1.0.1
              gh_version=2.100.0
              case "$(uname -m)" in
                x86_64)
                  arch=amd64
                  helper_sha=1ee8a93652e5d3cd829c35c8ba8afb3e1edf762ded0fffe2406a4f501ff5407c
                  gh_sha=e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be
                  ;;
                aarch64|arm64)
                  arch=arm64
                  helper_sha=22474eff6ecef4e081cda9e5742c462d2675e81f429b3503a4c7db9b5b6e1ce9
                  gh_sha=ea4e7a581a32ccad6cc7923cb1576ac5859ba4b9a16ab22eb8f8a96e78e2e961
                  ;;
                *)
                  echo "unsupported architecture: $(uname -m)" >&2
                  exit 1
                  ;;
              esac

              download_verified() {
                url="$1"
                digest="$2"
                destination="$3"
                temporary="${destination}.tmp"

                rm -f "$temporary"
                curl -fsSL --retry 3 --retry-all-errors -o "$temporary" "$url"
                printf '%s  %s\n' "$digest" "$temporary" | sha256sum -c -
                mv "$temporary" "$destination"
              }

              has_expected_sha() {
                test -f "$2" &&
                  printf '%s  %s\n' "$1" "$2" | sha256sum -c - >/dev/null 2>&1
              }

              has_expected_gh_version() {
                test -x "$1" &&
                  "$1" --version | grep -Fq "gh version $2 "
              }

              helper=/opt/github-bin/git-credential-github-app
              if ! has_expected_sha "$helper_sha" "$helper"; then
                download_verified \
                  "https://github.com/ericnorris/git-credential-github-app/releases/download/v${helper_version}/git-credential-github-app_${helper_version}_linux_${arch}" \
                  "$helper_sha" \
                  "$helper"
                chmod 0555 "$helper"
              fi

              gh=/opt/github-bin/gh
              if ! has_expected_gh_version "$gh" "$gh_version"; then
                archive=/opt/github-bin/gh.tar.gz
                extract=/opt/github-bin/.gh-extract
                gh_tmp="${gh}.tmp"
                download_verified \
                  "https://github.com/cli/cli/releases/download/v${gh_version}/gh_${gh_version}_linux_${arch}.tar.gz" \
                  "$gh_sha" \
                  "$archive"
                rm -rf "$extract" "$gh_tmp"
                mkdir "$extract"
                tar --no-same-owner -xzf "$archive" -C "$extract"
                install -m 0555 \
                  "$extract/gh_${gh_version}_linux_${arch}/bin/gh" \
                  "$gh_tmp"
                mv "$gh_tmp" "$gh"
                rm -rf "$archive" "$extract"
              fi
          image: "nousresearch/hermes-agent@sha256:\
            63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7"
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - mountPath: /opt/github-bin
              name: github-bin
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: hermes
      terminationGracePeriodSeconds: 60
      containers:
        - name: hermes
          args:
            - gateway
            - run
          image: "nousresearch/hermes-agent@sha256:\
            63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7"
          imagePullPolicy: IfNotPresent
          env:
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-discord
                  key: DISCORD_BOT_TOKEN
            - name: DISCORD_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: hermes-discord
                  key: DISCORD_ALLOWED_USERS
            - name: HERMES_GITHUB_TOKEN_FILE
              value: /var/run/github-token/token
            - name: PATH
              value: /opt/hermes-tools:/opt/github-bin:/opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: GIT_CONFIG_COUNT
              value: "2"
            - name: GIT_CONFIG_KEY_0
              value: credential.https://github.com.helper
            - name: GIT_CONFIG_VALUE_0
              value: /opt/hermes-tools/git-credential-hermes
            - name: GIT_CONFIG_KEY_1
              value: credential.https://github.com.useHttpPath
            - name: GIT_CONFIG_VALUE_1
              value: "true"
          ports:
            - containerPort: 8642
              name: gateway
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - curl -fsS --max-time 3 http://127.0.0.1:8642/health >/dev/null
            failureThreshold: 3
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - curl -fsS --max-time 3 http://127.0.0.1:8642/health >/dev/null
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - KILL
                - SETGID
                - SETUID
              drop:
                - ALL
            privileged: false
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          startupProbe:
            failureThreshold: 30
            periodSeconds: 10
            exec:
              command:
                - /bin/sh
                - -ec
                - curl -fsS --max-time 3 http://127.0.0.1:8642/health >/dev/null
            timeoutSeconds: 3
          volumeMounts:
            - mountPath: /opt/data
              name: data
            - mountPath: /opt/hermes-tools
              name: github-tools
              readOnly: true
            - mountPath: /opt/github-bin
              name: github-bin
              readOnly: true
            - mountPath: /var/run/github-token
              name: github-token
              readOnly: true
        - name: github-token-broker
          command:
            - /bin/sh
            - /opt/hermes-tools/token-broker.sh
          image: "nousresearch/hermes-agent@sha256:\
            63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7"
          imagePullPolicy: IfNotPresent
          env:
            - name: GITHUB_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hermes-github-app
                  key: clientId
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: hermes-github-app
                  key: installationId
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 5m
              memory: 16Mi
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  test -s /var/run/github-token/token
                  test -s /var/run/github-token/expires_at
                  now="$(date +%s)"
                  expiry="$(cat /var/run/github-token/expires_at)"
                  test "$expiry" -gt "$((now + 60))"
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - mountPath: /opt/hermes-tools
              name: github-tools
              readOnly: true
            - mountPath: /opt/github-bin
              name: github-bin
              readOnly: true
            - mountPath: /var/run/github-app
              name: github-app-secret
              readOnly: true
            - mountPath: /var/run/github-token
              name: github-token
      volumes:
        - name: config
          configMap:
            name: hermes-config
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: github-tools
          configMap:
            name: hermes-github-tools
            defaultMode: 0555
        - name: github-bin
          emptyDir: {}
        - name: github-token
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: github-app-secret
          secret:
            secretName: hermes-github-app
            defaultMode: 0400
            items:
              - key: privateKey
                path: privateKey
