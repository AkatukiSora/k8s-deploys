apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/instance: hermes
    app.kubernetes.io/name: hermes
  name: hermes
  namespace: hermes
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: hermes
        app.kubernetes.io/name: hermes
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: bootstrap-config
          command:
            - /bin/sh
            - -ec
            - |
              for file in config.yaml SOUL.md; do
                destination="/opt/data/$file"
                if [ -L "$destination" ]; then
                  echo "refusing to bootstrap through symlink: $destination" >&2
                  exit 1
                fi
                if [ -e "$destination" ]; then
                  chown 10000:10000 "$destination"
                  chmod 0640 "$destination"
                  continue
                fi
                temporary="$destination.bootstrap.$$"
                cp "/bootstrap/$file" "$temporary"
                chmod 0640 "$temporary"
                chown 10000:10000 "$temporary"
                mv "$temporary" "$destination"
              done
          image: "nousresearch/hermes-agent@sha256:\
            63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7"
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - mountPath: /bootstrap
              name: config
              readOnly: true
            - mountPath: /opt/data
              name: data
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: hermes
      terminationGracePeriodSeconds: 60
      containers:
        - name: hermes
          args:
            - gateway
            - run
          image: "nousresearch/hermes-agent@sha256:\
            63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7"
          imagePullPolicy: IfNotPresent
          env:
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-discord
                  key: DISCORD_BOT_TOKEN
            - name: DISCORD_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: hermes-discord
                  key: DISCORD_ALLOWED_USERS
          ports:
            - containerPort: 8642
              name: gateway
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: gateway
            failureThreshold: 3
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: gateway
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - KILL
                - SETGID
                - SETUID
              drop:
                - ALL
            privileged: false
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          startupProbe:
            failureThreshold: 30
            periodSeconds: 10
            tcpSocket:
              port: gateway
            timeoutSeconds: 3
          volumeMounts:
            - mountPath: /opt/data
              name: data
      volumes:
        - name: config
          configMap:
            name: hermes-config
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
