apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: mediamtx
  namespace: mediamtx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mediamtx
  template:
    metadata:
      annotations:
        mediamtx.akatuki-host.com/config-version: mpegts-cdn-500ms-v1
      labels:
        app.kubernetes.io/name: mediamtx
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mediamtx
          image: bluenviron/mediamtx:1.19.3
          imagePullPolicy: IfNotPresent
          env:
            - name: MTX_AUTHINTERNALUSERS_2_USER
              valueFrom:
                secretKeyRef:
                  name: mediamtx-rtmp-auth
                  key: username
            - name: MTX_AUTHINTERNALUSERS_2_PASS
              valueFrom:
                secretKeyRef:
                  name: mediamtx-rtmp-auth
                  key: password
            - name: MTX_HLSCDNSECRET
              valueFrom:
                secretKeyRef:
                  name: mediamtx-hls-cdn
                  key: secret
          ports:
            - name: rtmp
              containerPort: 1935
              protocol: TCP
            - name: hls
              containerPort: 8888
              protocol: TCP
            - name: api
              containerPort: 9997
              protocol: TCP
            - name: metrics
              containerPort: 9998
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: hls
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: hls
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
              readOnly: true
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: mediamtx-config
