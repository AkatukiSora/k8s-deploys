apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: mediamtx-hls-proxy
  namespace: mediamtx
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mediamtx-hls-proxy
  template:
    metadata:
      annotations:
        mediamtx.akatuki-host.com/config-version: v1
      labels:
        app.kubernetes.io/name: mediamtx-hls-proxy
    spec:
      automountServiceAccountToken: false
      containers:
        - name: caddy
          # yamllint disable rule:line-length
          image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
          # yamllint enable rule:line-length
          imagePullPolicy: IfNotPresent
          command:
            - caddy
          args:
            - run
            - --config
            - /etc/caddy/Caddyfile
            - --adapter
            - caddyfile
          env:
            - name: HLS_CDN_SECRET
              valueFrom:
                secretKeyRef:
                  name: mediamtx-hls-cdn
                  key: secret
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: caddy-config
              mountPath: /config
            - name: caddy-data
              mountPath: /data
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: mediamtx-hls-proxy-config
        - name: caddy-config
          emptyDir: {}
        - name: caddy-data
          emptyDir: {}
