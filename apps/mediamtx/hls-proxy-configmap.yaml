apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: mediamtx-hls-proxy-config
  namespace: mediamtx
data:
  Caddyfile: |
    {
      admin off
      auto_https off
    }

    :8080 {
      @health path /healthz
      respond @health 200

      reverse_proxy mediamtx-hls:8888 {
        header_up Authorization "Bearer {$HLS_CDN_SECRET}"
        header_up -Cookie
      }
    }
