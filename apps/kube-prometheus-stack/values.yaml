nameOverride: "kube-prometheus-stack"

crds:
  enabled: true

defaultRules:
  disabled:
    TargetDown: true

kubeProxy:
  enabled: false

kubeControllerManager:
  enabled: true
  endpoints:
    - 10.0.40.11
    - 10.0.40.12
    - 10.0.40.13
  serviceMonitor:
    https: true
    insecureSkipVerify: true

kubeScheduler:
  enabled: true
  endpoints:
    - 10.0.40.11
    - 10.0.40.12
    - 10.0.40.13
  serviceMonitor:
    https: true
    insecureSkipVerify: true

kubeEtcd:
  # The chart only provisions its built-in etcd Grafana dashboard when enabled.
  enabled: true
  serviceMonitor:
    # etcd-scrapeconfig.yaml scrapes all control-plane nodes directly.
    enabled: false

grafana:
  enabled: true
  env:
    GF_DATABASE_TYPE: postgres
    GF_DATABASE_HOST: grafana-postgres-rw.monitoring:5432
    GF_DATABASE_NAME: grafana
    GF_DATABASE_SSL_MODE: disable
  serviceMonitor:
    labels:
      release: kube-prometheus-stack
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
  admin:
    existingSecret: grafana-admin-user
    userKey: admin-user
    passwordKey: admin-password
  envValueFrom:
    GF_DATABASE_USER:
      secretKeyRef:
        name: grafana-postgres-app
        key: username
    GF_DATABASE_PASSWORD:
      secretKeyRef:
        name: grafana-postgres-app
        key: password
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc-client-secret
        key: client-secret
  grafana.ini:
    server:
      root_url: https://grafana.akatuki-host.com
    auth:
      disable_login_form: false
    auth.generic_oauth:
      enabled: true
      name: Authentik
      allow_sign_up: true
      use_refresh_token: true
      client_id: grafana
      scopes: openid profile email offline_access
      auth_url: https://auth.akatuki-host.com/application/o/authorize/
      token_url: https://auth.akatuki-host.com/application/o/token/
      api_url: https://auth.akatuki-host.com/application/o/userinfo/
      login_attribute_path: preferred_username
      name_attribute_path: name
      email_attribute_path: email
      groups_attribute_path: groups
      role_attribute_path: contains(groups[*], 'app:grafana:global:admin') && 'Admin' || contains(groups[*], 'app:grafana:global:editor') && 'Editor' || contains(groups[*], 'app:grafana:global:viewer') && 'Viewer' || 'None'
      role_attribute_strict: true
  ingress:
    enabled: true
    ingressClassName: cloudflare-tunnel
    hosts:
      - grafana.akatuki-host.com
    path: /
    pathType: Prefix

prometheus:
  enabled: true
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # Select every explicitly managed PodMonitor, including CNPG targets.
    podMonitorSelector: {}
    # Discover Git-managed CNPG PodMonitors across application namespaces.
    podMonitorNamespaceSelector: {}
    # Temporary storage-pressure mitigation. Return to shorter intervals after storage replacement.
    scrapeInterval: 1m
    evaluationInterval: 1m
    retention: 10d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-rbd
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    # Routing and the Discord receivers are defined in alertmanagerconfig.yaml.
    # prometheus-operator v0.80 rejects `webhook_url_file` in the Alertmanager
    # configuration Secret, so the webhook URLs are referenced by Secret key
    # from an AlertmanagerConfig instead. Do not scope those routes to the
    # AlertmanagerConfig namespace.
    alertmanagerConfigMatcherStrategy:
      type: None
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-rbd
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by:
        - alertname
        - namespace
        - severity
    receivers:
      - name: "null"
