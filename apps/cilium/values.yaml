# Cilium Helm values (steady state).
#
# This file describes the target configuration. The node-by-node migration from
# Flannel overlays `values-migration.yaml` on top of it; see
# docs/cilium-migration-runbook.md for the stage that each combination serves.

# --- IPAM and routing ---------------------------------------------------------
# cluster-pool uses a Pod CIDR that does not overlap with Flannel's
# 10.244.0.0/16, which is required for the live migration.
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.245.0.0/16
    clusterPoolIPv4MaskSize: 24

# All nodes share one L2 segment on ens18 (10.0.40.0/24), so Pod CIDRs are
# reached with direct routes instead of a second overlay.
routingMode: native
ipv4NativeRoutingCIDR: 10.245.0.0/16
autoDirectNodeRoutes: true

# Attach only to the management interface. Talos exposes the kernel name eth0
# (ens18 is an alternative name). eth1/eth2 carry the Ceph and MetalLB VLANs
# and stay outside of Cilium's datapath.
devices: eth0

# kube-proxy is kept for now: the MetalLB RoutingRuleConfig in talos/patches
# relies on kube-proxy's DNAT happening before the routing policy lookup.
# Replace kube-proxy only in a separate, verified change.
kubeProxyReplacement: false

# Reach the API server through Talos KubePrism instead of the in-cluster Service.
k8sServiceHost: localhost
k8sServicePort: 7445

# --- Encryption ---------------------------------------------------------------
# WireGuard encrypts Pod-to-Pod traffic between nodes. Same-node traffic and
# host-network traffic are not encrypted (nodeEncryption stays off).
encryption:
  enabled: true
  type: wireguard
  nodeEncryption: false

# --- Network policy -----------------------------------------------------------
# Policies are evaluated but not enforced while this is true; verdicts are
# visible in Hubble. Set it to false only after the existing NetworkPolicies
# have been reviewed (see the runbook).
policyAuditMode: true
policyEnforcementMode: default

# --- Talos-specific settings --------------------------------------------------
# Talos mounts cgroup v2 and bpffs itself and does not allow SYS_MODULE.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Restart agents when the rendered configuration changes.
rollOutCiliumPods: true

# The standalone Envoy DaemonSet is only needed for L7 policy, Ingress and
# Gateway API. Leave it off to save node memory; enable it when L7 is needed.
envoy:
  enabled: false

# --- Observability ------------------------------------------------------------
# Certificates are generated by a Job instead of `helm template`, so that Argo CD
# does not see a new self-signed CA on every render.
hubble:
  enabled: true
  tls:
    auto:
      enabled: true
      method: cronJob
  relay:
    enabled: true
  ui:
    enabled: true

prometheus:
  enabled: true

# --- Resources ----------------------------------------------------------------
# Requests only; node memory is the scarce resource on this cluster.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
operator:
  replicas: 2
  # Recover stale sandboxes without having the operator delete unmanaged Pods.
  # Any remaining unmanaged workloads need an explicit, workload-scoped review.
  unmanagedPodWatcher:
    restart: false
  prometheus:
    enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
