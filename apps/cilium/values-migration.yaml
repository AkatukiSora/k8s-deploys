# Overlay for the live migration from Flannel (Cilium "secondary" mode).
#
# Use together with values.yaml, listed after it so these keys win:
#   valueFiles: [values.yaml, values-migration.yaml]
#
# In this mode Cilium builds its own overlay but does not write a CNI
# configuration, so no Pod is attached to it until a node is labeled for
# migration. Remove this file from the Application once every node is migrated.

operator:
  unmanagedPodWatcher:
    restart: false   # do not restart Pods that are still on Flannel

# Tunnel mode on Cilium's default VXLAN port (8472). Flannel here uses 4789.
routingMode: tunnel
tunnelProtocol: vxlan
autoDirectNodeRoutes: false
ipv4NativeRoutingCIDR: ""

cni:
  customConf: true   # do not install a CNI configuration file
  uninstall: false   # do not remove the CNI configuration on shutdown

# Traffic from Flannel Pods would be dropped by policy during the migration.
policyEnforcementMode: never
policyAuditMode: false

bpf:
  hostLegacyRouting: true   # allow routing between Cilium and Flannel

# WireGuard is enabled in the final stage, after all nodes are migrated.
encryption:
  enabled: false
