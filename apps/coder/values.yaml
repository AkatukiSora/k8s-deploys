coder:
  podSecurityContext:
    runAsNonRoot: true

  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  env:
    - name: CODER_ACCESS_URL
      value: "https://coder.akatuki-host.com"
    - name: CODER_OIDC_ISSUER_URL
      value: "https://auth.akatuki-host.com/application/o/coder/"
    - name: CODER_OIDC_CLIENT_ID
      value: "coder"
    - name: CODER_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: coder-oidc-client-secret
          key: client-secret
    - name: CODER_OIDC_SCOPES
      value: "openid,profile,email,offline_access"
    - name: CODER_OIDC_SIGN_IN_TEXT
      value: "Sign in with Authentik"
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef:
          name: coder-postgres-app
          key: uri
    # Use relayed (DERP) connections only. Direct connections cannot be
    # established because workspace pods are not reachable over UDP, and this
    # stops the server from sending STUN and port-mapping probes that the
    # network policy denies.
    - name: CODER_DERP_SERVER_STUN_ADDRESSES
      value: "disable"
  service:
    type: ClusterIP
  serviceAccount:
    # The chart grants pod/PVC (and Deployment) permissions in the release
    # namespace by default. Disable that and grant them only in coder-worker.
    workspacePerms: false
    enableDeployments: false
    workspaceNamespaces:
      - name: coder-worker
        workspacePerms: true
        enableDeployments: true
