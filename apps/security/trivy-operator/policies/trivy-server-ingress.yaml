apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trivy-server-ingress
  namespace: trivy-system
spec:
  # The Trivy server accepts unauthenticated HTTP. Only Pods in this namespace
  # (the operator and its scan jobs) may reach it.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trivy-server
      app.kubernetes.io/instance: trivy-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 4954
          protocol: TCP
