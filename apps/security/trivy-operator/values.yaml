trivy:
  severity: CRITICAL,HIGH,MEDIUM
  useBuiltinRegoPolicies: "false"
  useEmbeddedRegoPolicies: "true"
  externalRegoPoliciesEnabled: false
  # The built-in Trivy server keeps the vulnerability database in an emptyDir.
  # The database is re-downloaded when the server Pod restarts, so no PVC is needed.
  storageClassEnabled: false

operator:
  # Scan jobs query a single in-cluster Trivy server for vulnerability data instead
  # of each downloading and unpacking the database into node-local storage.
  # Standalone mode also makes the containers of one scan Pod contend for the same
  # cache lock, which fails scans of multi-container Pods.
  builtInTrivyServer: true
  # Temporary storage-pressure mitigation. Restore concurrency after storage replacement.
  scanJobsConcurrentLimit: 1
  # Wait before retrying a failed scan job, so a persistently failing scan cannot
  # run back-to-back on a node (the chart default is 30s).
  scanJobsRetryDelay: 30m
  metricsFindingsEnabled: true
  metricsVulnIdEnabled: false
  metricsConfigAuditInfo: true
  metricsExposedSecretInfo: true
  metricsRbacAssessmentInfo: true
  vulnerabilityScannerEnabled: true
  configAuditScannerEnabled: true
  exposedSecretScannerEnabled: true
  rbacAssessmentScannerEnabled: true
  clusterComplianceEnabled: false

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

excludeNamespaces: kube-system,kube-public,kube-node-lease,argocd

compliance:
  specs: []
