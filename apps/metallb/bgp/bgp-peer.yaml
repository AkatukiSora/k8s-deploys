apiVersion: metallb.io/v1beta2
kind: BGPPeer
metadata:
  name: udm-pro
  namespace: metallb
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: metallb
    app.kubernetes.io/component: bgp-peer
spec:
  # UniFi ルーターの BGP router-id
  peerAddress: 192.168.5.1
  # UDM Pro の ASN
  peerASN: 65000
  # Kubernetes 側の ASN
  myASN: 65020
  # 外部 LoadBalancer を受ける worker だけで BGP セッションを確立する
  nodeSelectors:
    - matchExpressions:
        - key: node-role.kubernetes.io/control-plane
          operator: DoesNotExist
  # BFD プロファイルを使う場合 (高速障害検知)
  # bfdProfile: ""
  # Kubernetes ノード (10.0.40.0/24) と UniFi router-id は別セグメント
  ebgpMultiHop: true
  # keepalive / hold time (秒)
  keepaliveTime: 30s
  holdTime: 90s
