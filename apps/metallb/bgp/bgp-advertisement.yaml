apiVersion: metallb.io/v1beta1
kind: BGPAdvertisement
metadata:
  name: bgp-advertisement
  namespace: metallb
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: metallb
    app.kubernetes.io/component: bgp-advertisement
spec:
  # 広告対象の IPAddressPool を指定
  ipAddressPools:
    - bgp-pool
  # Proxmox 経由と VLAN 10 の UniFi 直結へ LoadBalancer IP を広告する
  peers:
    - pve-node1
    - pve-node2
    - w1-pve-node1
    - w1-pve-node2
    - w2-pve-node1
    - w2-pve-node2
    - w3-pve-node1
    - w3-pve-node2
    - w1-unifi
    - w2-unifi
    - w3-unifi
  # アグリゲーション: /32 単位でなくプールのCIDR全体を広告する場合は設定
  # aggregationLength: 24
  # communities: []
  # localPref は iBGP でのみ有効 (eBGP では無視される)
