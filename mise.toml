[tools]
argocd = "latest"
helm = "latest"
kubectl = "latest"
talosctl = "1.13.6"

[tasks.talos-validate]
description = "Validate Talos YAML patches and optionally render MachineConfigs"
run = "bash talos/scripts/validate.sh"

[hooks.enter]
shell = "bash"
script = "source <(talosctl completion bash)"
