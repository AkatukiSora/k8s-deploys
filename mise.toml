[tools]
argocd = "latest"
helm = "latest"
kubectl = "latest"
talosctl = "1.13.6"
terraform = "1.16.5"

[tasks.talos-generate]
description = "Render one untracked Talos MachineConfig: mise run talos-generate -- <node>"
run = "bash talos/scripts/generate.sh"

[hooks.enter]
shell = "bash"
script = "source <(talosctl completion bash)"

[env]
_.file = ".env"