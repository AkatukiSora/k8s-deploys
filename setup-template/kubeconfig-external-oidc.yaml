apiVersion: v1
kind: Config
clusters:
  - name: k8s-soralab-external
    cluster:
      # The API certificate contains this VIP as an IP SAN. This avoids
      # distributing private DNS and only this /32 is sent through WARP.
      server: https://10.0.40.99:6443
      certificate-authority-data: 
users:
  - name: oidc
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1
        command: kubectl
        args:
          - oidc-login
          - get-token
          - --oidc-issuer-url=https://auth.akatuki-host.com/application/o/kubernetes/
          - --oidc-client-id=kubernetes-cluster
          - --oidc-extra-scope=profile
        interactiveMode: Never
        provideClusterInfo: false
contexts:
  - name: oidc@k8s-soralab-external
    context:
      cluster: k8s-soralab-external
      user: oidc
      namespace: default
current-context: oidc@k8s-soralab-external