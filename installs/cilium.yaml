apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    # Protect this cluster-critical child from parent prune/deletion. The
    # child's own automated policy also leaves CNI resource pruning disabled.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "-10"
spec:
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  sources:
    - repoURL: https://helm.cilium.io/
      targetRevision: 1.20.3
      chart: cilium
      helm:
        # Steady state: Cilium owns the CNI configuration. Do not add the
        # secondary-mode migration overlay to a cluster without Flannel.
        valueFiles:
          - $repo/apps/cilium/values.yaml
    - repoURL: https://github.com/AkatukiSora/k8s-deploys.git
      targetRevision: master
      ref: repo

  project: default
  # Automatic steady-state reconciliation starts only after apps-root has
  # registered this Application from the merged master branch.
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
