apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph-external
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.rook.io/release
      chart: rook-ceph
      targetRevision: v1.18.6
      helm:
        valueFiles:
          - $repo/apps/rook-ceph-external/operator-values.yaml
    - repoURL: https://github.com/AkatukiSora/k8s-deploys.git
      targetRevision: master
      ref: repo
      path: apps/rook-ceph-external
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
