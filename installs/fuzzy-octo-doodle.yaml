apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fuzzy-octo-doodle
  namespace: argocd
spec:
  description: fuzzy-octo-doodle application (manifests live in the application repository)
  sourceRepos:
    - https://github.com/AkatukiSora/fuzzy-octo-doodle.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: fuzzy-octo-doodle
  # The source repository has other contributors, so limit what it can create:
  # its own namespace and namespaced workload/network kinds only (no RBAC, no Secrets).
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: batch
      kind: CronJob
    - group: batch
      kind: Job
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: postgresql.cnpg.io
      kind: Cluster
    # Argo CD は、プロジェクトで許可されていない種類を、リソースツリーに表示しない。
    # 下の 3 つは、Deployment や CNPG の Cluster が作る子リソースを画面で見るために許可する。
    - group: apps
      kind: ReplicaSet
    - group: ""
      kind: Pod
    - group: ""
      kind: PersistentVolumeClaim
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fuzzy-octo-doodle
  namespace: argocd
  # 同期の結果を、アプリのリポジトリの GitHub Deployments に出す（apps/argocd/notifications-cm.yaml）。
  annotations:
    notifications.argoproj.io/subscribe.on-sync-running.github: ""
    notifications.argoproj.io/subscribe.on-deployed.github: ""
    notifications.argoproj.io/subscribe.on-sync-failed.github: ""
    notifications.argoproj.io/subscribe.on-health-degraded.github: ""
spec:
  destination:
    namespace: fuzzy-octo-doodle
    server: https://kubernetes.default.svc
  project: fuzzy-octo-doodle
  source:
    path: infra
    repoURL: https://github.com/AkatukiSora/fuzzy-octo-doodle.git
    targetRevision: main
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      name: fuzzy-octo-doodle-db
      namespace: fuzzy-octo-doodle
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
  # No automated sync yet: the container images are not published, so an
  # automatic sync would only produce ImagePullBackOff. Enable it once they exist.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
