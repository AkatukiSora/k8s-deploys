machine:
  kubelet:
    extraArgs:
      node-labels: "workload.sora-lab.dev/mongodb-avx2=true"
  network:
    interfaces:
      - interface: ens18
        mtu: 1450
        addresses:
          - 10.0.40.54/24
        routes:
          - network: 0.0.0.0/0
            gateway: 10.0.40.1
      - interface: ens19
        mtu: 9000
        addresses:
          - 192.168.8.54/24
      - interface: ens20
        mtu: 9000
        addresses:
          - 192.168.10.54/24
  install:
    disk: /dev/sda
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: w4
auto: off
