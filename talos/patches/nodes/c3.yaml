machine:
  network:
    interfaces:
      - interface: ens18
        mtu: 1450
        addresses:
          - 10.0.40.13/24
        routes:
          - network: 0.0.0.0/0
            gateway: 10.0.40.1
      - interface: ens19
        mtu: 1500
        dhcp: true
      - interface: ens20
        mtu: 9000
        addresses:
          - 192.168.8.13/24
  install:
    disk: /dev/sda
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: c3
auto: off
